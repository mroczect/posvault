[package]
name = "posvault_sync"
version = "0.2.1"
edition = "2024"
description = "Branch management and synchronisation for posvault"
license = "MIT"
repository = "https://github.com/mroczect/posvault"

[dependencies]
posvault_handler = { path = "../posvault_handler", version = "0.2.1" }
posvault_store = { path = "../posvault_store", version = "0.2.1" }
libvctrl = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
thiserror = "2.0"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
