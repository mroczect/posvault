[package]
name = "posvault_query"
version = "0.1.0"
edition = "2024"
description = "Query engine and materialized views for posvault"
license = "MIT"
repository = "https://github.com/mroczect/posvault"

[dependencies]
posvault_handler = { path = "../posvault_handler" }
posvault_store = { path = "../posvault_store" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
