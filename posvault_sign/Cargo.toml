[package]
name = "posvault_sign"
version = "1.0.0"
edition = "2024"
description = "Ed25519 digital signatures for posvault events and journal"
license = "MIT"
repository = "https://github.com/mroczect/posvault"

[dependencies]
ed25519-dalek = "3.0"
posvault_handler = { path = "../posvault_handler", version = "1.0.0" }
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
