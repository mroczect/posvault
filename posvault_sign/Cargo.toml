[package]
name = "posvault_sign"
version = "0.2.1"
edition = "2024"
description = "Ed25519 digital signatures for posvault events and journal"
license = "MIT"
repository = "https://github.com/mroczect/posvault"

[dependencies]
bincode = "1.3"
ed25519-dalek = "2.0"
posvault_handler = { path = "../posvault_handler", version = "0.2.1" }
rand_core = "0.6"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"