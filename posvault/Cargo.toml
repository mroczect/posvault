[package]
name = "posvault"
version = "0.2.3"
edition = "2024"
description = "Encrypted, version-controlled POS database framework"
license = "MIT"
repository = "https://github.com/mroczect/posvault"
readme = "README.md"
keywords = ["pos", "database", "version-control", "encryption", "event-sourcing"]
categories = ["database", "cryptography", "development-tools"]

[dependencies]
posvault_handler = { path = "../posvault_handler", version = "0.2.3" }
posvault_store = { path = "../posvault_store", version = "0.2.3" }
posvault_crypto = { path = "../posvault_crypto", version = "0.2.3" }
posvault_auth = { path = "../posvault_auth", version = "0.2.3" }
posvault_sign = { path = "../posvault_sign", version = "0.2.3" }
posvault_sync = { path = "../posvault_sync", version = "0.2.3" }
posvault_query = { path = "../posvault_query", version = "0.2.3" }
libvctrl = "0.5"
age-credentials = "1.0"
ed25519-dalek = { version = "3", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
